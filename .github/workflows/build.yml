name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PVERSION_CODE=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "cookbook-${VERSION}.apk"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: APK summary
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt2" dump badging cookbook-*.apk | grep -E "^(package|minSdkVersion|targetSdkVersion|application-label:|uses-permission|locales)"
          "${BT}apksigner" verify --print-certs cookbook-*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -la cookbook-*.apk
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cookbook-apk
          path: cookbook-*.apk

      - name: Publish release (new version only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - bump APP_VERSION_NAME in gradle.properties to publish a new one."
            exit 0
          fi
          gh release create "$TAG" "cookbook-${APP_VERSION}.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
