name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read version
        id: version
        run: echo "version=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Show lint findings
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true


      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found."
          elif [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            # A release signed with a throwaway key could not be installed over the real app.
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret set - refusing to build a release."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "cookbook-${{ steps.version.outputs.version }}.apk"

      - name: APK summary
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt2" dump badging cookbook-*.apk | grep -E "^(package|minSdkVersion|targetSdkVersion|application-label:|uses-permission|locales)"
          "${BT}apksigner" verify --print-certs cookbook-*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -la cookbook-*.apk
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cookbook-apk
          path: cookbook-*.apk

  release:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cookbook-apk

      - name: Publish release (new version only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              # Left over from an interrupted run (e.g. a GitHub server error): start over.
              echo "Removing unfinished draft release $TAG."
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "Release $TAG already exists - bump APP_VERSION_NAME in gradle.properties to publish a new one."
              exit 0
            fi
          fi
          gh release create "$TAG" "cookbook-${APP_VERSION}.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
